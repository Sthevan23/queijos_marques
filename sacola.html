<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Sua sacola — Marques Mineiro">
    <meta name="theme-color" content="#A0522D">
    <title>Sacola - Marques Mineiro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/global.css?v=8">
    <link rel="stylesheet" href="styles/index.css?v=8">
</head>

<body class="cart-page">
    <header class="cart-topbar">
        <a class="cart-page__back" href="index.html">← Catálogo</a>
        <strong class="cart-topbar__brand">Marques Mineiro</strong>
        <span class="cart-topbar__spacer"></span>
    </header>

    <main class="cart-page__main">
        <header class="cart-page__head">
            <p class="cart-page__eyebrow">Seu pedido</p>
            <h1 class="cart-page__title">Carrinho</h1>
            <p class="cart-page__subtitle" id="cart-page-subtitle">Nenhum item ainda</p>
        </header>

        <div class="cart-page__layout">
            <section class="cart-page__list" aria-label="Itens do carrinho">
                <div id="cartItems"></div>
                <div class="cart-page__empty hidden" id="cartEmpty">
                    <h2>Carrinho vazio</h2>
                    <p>Escolha seus queijos no catálogo e adicione aqui.</p>
                    <a class="btn-primary" href="index.html">Ver catálogo</a>
                </div>
            </section>

            <aside class="cart-page__summary" id="cart-page-summary" hidden>
                <div class="cart-summary">
                    <h2 class="cart-summary__title">Resumo</h2>

                    <div class="cart-summary__row">
                        <span>Subtotal</span>
                        <strong id="cartTotalModal">R$ 0,00</strong>
                    </div>
                    <div class="cart-summary__row cart-summary__row--total">
                        <span>Total</span>
                        <strong id="cart-page-total">R$ 0,00</strong>
                    </div>

                    <div class="cart-checkout">
                        <p class="cart-checkout__label">Seus dados</p>
                        <div class="cart-checkout__fields">
                            <label class="order-field">Nome *
                                <input type="text" id="cart-nome" placeholder="Seu nome" autocomplete="name">
                            </label>
                        </div>
                        <label class="order-field">WhatsApp *
                            <input type="tel" id="cart-phone" placeholder="(00) 00000-0000" inputmode="numeric" autocomplete="tel" maxlength="15">
                        </label>
                        <div class="cart-address" id="cart-address-wrap">
                            <label class="order-field" for="cart-address">
                                Endereço de entrega *
                                <textarea id="cart-address" rows="3" maxlength="280" placeholder="Rua, número, bairro, referência…"></textarea>
                            </label>
                        </div>

                        <p class="cart-error" id="cart-error" hidden></p>
                        <button type="button" class="btn-primary cart-summary__cta" id="checkoutBtnModal" disabled>
                            Finalizar pelo WhatsApp
                        </button>
                        <button type="button" class="btn-ghost" id="clearCart">Limpar carrinho</button>
                        <a class="btn-ghost" href="index.html">Continuar comprando</a>
                    </div>
                </div>
            </aside>
        </div>
    </main>

    <div id="toast-container"></div>
    <script src="custos.js?v=8"></script>
    <script src="script.js?v=8"></script>
</body>

</html>
